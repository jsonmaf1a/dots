# Startup
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user restart pipewire
exec-once = hyprctl setcursor BreezeX-Black 28
# exec-once = swww init
exec-once = $SCRIPTS/xdp.sh
exec-once = $SCRIPTS/setgtk.sh dark
exec-once = systemctl --user start hyprpaper
exec-once = python $SCRIPTS/playerctl.py
