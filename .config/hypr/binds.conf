# Binds
# General
bind = SUPER, W, killactive,
bind = SUPER ALT, BACKSPACE, exit,
bind = SUPER, S, togglefloating,
bind = SUPER, F, fullscreen,
bind = SUPER SHIFT, F, fullscreen, 1
bind = SUPER, D, exec, rofi -show drun
bind = SUPER, P, pseudo, # dwindle
bind = SUPER, E, togglesplit, # dwindle
bind = SUPER, TAB, focusurgentorlast,
bind = SUPER, Q, pin,
bind = SUPER, BACKSLASH, workspace, previous
bind = SUPER, BACKSPACE, exec, rofi -show power-menu -modi power-menu:$SCRIPTS/rofi-power-menu.sh
bind = SUPER, B, exec, pkill -SIGUSR1 waybar
bind = SUPER SHIFT, B, exec, pkill -SIGUSR2 waybar
bind = SUPER, SPACE, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next # $SCRIPTS/kb.sh
bind = SUPER, F1, exec, $SCRIPTS/gamemode.sh
bind = SUPER, F2, exec, hyprpicker -a -f hex
bind = ALT, TAB,cyclenext,
bind = ALT, TAB,bringactivetotop,
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Apps
bind = ,PRINT, exec, grim save area - | satty --filename -
bind = SUPER, PRINT, exec, grim save screen - | satty --filename -
bind = SUPER, RETURN, exec, wezterm
bind = SUPER CONTROL, RETURN, exec, alacritty

# Special workspaces
bind = SUPER, M, togglespecialworkspace, music
bind = SUPER SHIFT, M, movetoworkspace, special:music

# Move focus
bind = SUPER, left, movefocus, l
bind = SUPER, H, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, L, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, K, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, J, movefocus, d

# Move window
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, right, moveactive, 50 0
bind = SUPER SHIFT, left, moveactive, -50 0
bind = SUPER SHIFT, up, moveactive, 0 -50
bind = SUPER SHIFT, down, moveactive, 0 50

# Switch workspaces
bind = SUPER, 1, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 1
bind = SUPER, 2, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 2
bind = SUPER, 3, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 3
bind = SUPER, 4, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 4
bind = SUPER, 5, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 5
bind = SUPER, 6, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 6
bind = SUPER, 7, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 7
bind = SUPER, 8, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 8
bind = SUPER, 9, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 9
bind = SUPER, 0, exec, $SCRIPTS/moveToWorkspaceAndCloseSpecial.sh 10
bind = SUPER, BRACKETLEFT, workspace, r-1
bind = SUPER, BRACKETRIGHT, workspace, r+1

# Move active window to a workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Volume and Media Control
bindel = , XF86MonBrightnessUp, exec, $SCRIPTS/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, $SCRIPTS/brightness.sh down
bindel = SUPER, XF86MonBrightnessUp, exec, hyprctl hyprsunset temperature 6000
bindel = SUPER, XF86MonBrightnessDown, exec, hyprctl hyprsunset temperature 3000
bindel = ALT, XF86MonBrightnessUp, exec, hyprctl hyprsunset temperature +500
bindel = ALT, XF86MonBrightnessDown, exec,hyprctl hyprsunset temperature -500
bindel = , XF86AudioRaiseVolume, exec, $SCRIPTS/volume.sh up
bindel = , XF86AudioLowerVolume, exec, $SCRIPTS/volume.sh down
bindl = , XF86AudioMute, exec, $SCRIPTS/volume.sh mute
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindl = SUPER, Home, exec, playerctl play-pause
bindl = SUPER, End, exec, playerctl previous
bindl = SUPER, Insert, exec, playerctl next
