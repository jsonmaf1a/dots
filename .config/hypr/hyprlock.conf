background {
  path = $HOME/wallpapers/3.jpg
  blur_passes = 2
}

input-field {
  size = 360, 70

  outline_thickness = 2

  dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = false
  dots_rounding = -1 # -1 default circle, -2 follow input-field rounding

  outer_color = rgb(200,200,200)
  inner_color = rgba(200, 200, 200, 0.3)
  font_color = rgb(200, 200, 200)

  fade_timeout = 3000
  placeholder_text = <span font-family="JetBrains Mono NFM">$PAMPROMPT</span>

  hide_input = false
  rounding = 1 # -1 means complete rounding (circle/oval)

  position = 0, -20
  halign = center
  valign = center
}

label {
  text = cmd[update:100] echo "$TIME"
  text_align = center

  color = rgba(255, 255, 255, 1.0)

  font_size = 86
  font_family = JetBrains Mono NFM

  position = 0, 180
  halign = center
  valign = center
}

label {
  text = cmd[update:100] echo "$(date "+%A %d %B %Y")"
  text_align = center

  color = rgba(255, 255, 255, 1.0)

  font_size = 24
  font_family = JetBrains Mono NFM

  position = 0, 80
  halign = center
  valign = center
}

label {
  text = User: $USER
  text_align = center

  color = rgba(200, 200, 200, 1.0)

  font_family = JetBrains Mono NFM
  font_size = 12

  position = -20, 40
  halign = right
  valign = bottom
}

label {
  text = Language: $LAYOUT
  text_align = center

  color = rgba(200, 200, 200, 1.0)

  font_family = JetBrains Mono NFM
  font_size = 10

  position = -20, 20
  halign = right
  valign = bottom
}
